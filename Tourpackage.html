
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourist Packages - Travel and Tours</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f0f0;
            min-height: 100vh;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 227px;
            background: #16869a;
            color: white;
            padding: 25px 10px;
            flex-shrink: 0;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 35px;
        }

        .logo span {
            color: #071d27;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 18px;
            font-weight: bold;
            padding: 13px 12px;
            margin-bottom: 8px;
            border-radius: 12px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #45b9bb;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            min-width: 0;
            padding: 15px 10px;
        }

        /* TOP BAR */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #999;
            padding: 5px 15px 15px;
            margin-bottom: 30px;
        }

        .logout {
            color: #222;
            text-decoration: none;
            font-weight: bold;
            font-family: Georgia, serif;
        }

        .logout:hover {
            color: #16869a;
        }

        .admin {
            font-family: Georgia, serif;
            font-size: 17px;
            font-weight: bold;
        }

        /* PAGE HEADING */
        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 0 15px 45px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 28px;
            color: #171717;
        }

        .heading-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* SEARCH */
        .search-box input {
            width: 215px;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #999;
            background: transparent;
            outline: none;
        }

        .search-box input:focus {
            border-color: #16869a;
        }

        /* ADD TOUR LINK */
        .add-button {
            display: inline-block;
            background: #00c6d2;
            color: white;
            text-decoration: none;
            border: none;
            padding: 10px 13px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-button:hover {
            background: #009eaa;
        }

        /* TABLE */
        .table-container {
            width: 100%;
            overflow-x: auto;
            padding: 0 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #e3f8f5;
        }

        th {
            background: #f7f0f0;
            font-size: 14px;
            font-weight: normal;
            padding: 12px 8px;
            text-align: center;
            border: none;
        }

        td {
            padding: 9px 8px;
            text-align: center;
            border: 1px solid #b7c9c7;
            font-size: 15px;
        }

        tbody tr:hover {
            background: #d2f0ec;
        }

        /* ACTION BUTTONS */
        .action-button {
            border: none;
            border-radius: 9px;
            padding: 9px 12px;
            cursor: pointer;
            margin: 2px;
            font-size: 12px;
        }

        .edit-button {
            background: #b5f8e3;
            color: #222;
        }

        .delete-button {
            background: #f18c8c;
            color: #222;
        }

        .action-button:hover {
            opacity: 0.75;
        }

        .empty-message {
            padding: 25px;
            text-align: center;
            color: #666;
        }

        /* RESPONSIVE */
        @media (max-width: 850px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 12px;
            }

            .logo {
                font-size: 23px;
                margin-bottom: 15px;
            }

            .sidebar a {
                display: inline-block;
                font-size: 14px;
                padding: 10px;
            }

            .topbar {
                margin-bottom: 25px;
            }

            .page-heading {
                margin-bottom: 25px;
            }

            .heading-right {
                width: 100%;
            }

            .search-box {
                flex: 1;
            }

            .search-box input {
                width: 100%;
            }

            .table-container {
                padding: 0;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <span>◉</span> Travel&<br>
            Tours
        </div>

        <a href="Tourist_listhtml.html">⌂ Tourist List</a>

        <a href="Tourpackage.html" class="active">
            ♧ Tour Package
        </a>

        <a href="Addtourist.html">♙ Add Tourist</a>

        <a href="AddTourr.html">＋ Add Tour</a>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="topbar">

            <a href="travel_index.html" class="logout">
                ⇥ Log out
            </a>

            <div class="admin">◉ &nbsp; Admin</div>

        </header>

        <!-- PAGE TITLE AND SEARCH -->
        <div class="page-heading">

            <h1>Tourist Packages</h1>

            <div class="heading-right">

                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="⌕ Search tour package"
                        oninput="displayPackages()"
                    >
                </div>

                <a href="AddTourr.html" class="add-button">
                    ⊕ Add Tour
                </a>

            </div>

        </div>

        <!-- TOUR PACKAGE TABLE -->
        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Tour Destination<br>packages</th>
                        <th>Prices</th>
                        <th>Duration Days</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="packageTable"></tbody>

            </table>

            <p class="empty-message" id="emptyMessage"
               style="display: none;">
                No tour packages found.
            </p>

        </div>

    </main>

</div>

<script>

    // SAMPLE TOUR PACKAGE DATA
    var samplePackages = [
        {
            id: "TP001",
            destination: "Boracay Katiklan",
            price: 3500,
            duration: "3days"
        },
        {
            id: "TP002",
            destination: "Baguio Tour",
            price: 5000,
            duration: "5days"
        },
        {
            id: "TP003",
            destination: "Siargao tour",
            price: 12000,
            duration: "7days"
        },
        {
            id: "TP004",
            destination: "Palawan Puerto",
            price: 8000,
            duration: "4days"
        },
        {
            id: "TP005",
            destination: "Cebu Island",
            price: 10000,
            duration: "6days"
        }
    ];

    // LOAD PACKAGES FROM LOCAL STORAGE
    var packages = JSON.parse(
        localStorage.getItem("tourPackages")
    );

    if (!packages) {
        packages = samplePackages;
        savePackages();
    }

    // SAVE PACKAGES
    function savePackages() {

        localStorage.setItem(
            "tourPackages",
            JSON.stringify(packages)
        );

    }

    // DISPLAY PACKAGES
    function displayPackages() {

        var table = document.getElementById("packageTable");

        var search = document.getElementById("searchInput")
            .value.toLowerCase();

        table.innerHTML = "";

        var filteredPackages = packages.filter(function(item) {

            return String(item.destination)
                .toLowerCase()
                .includes(search);

        });

        filteredPackages.forEach(function(item) {

            var row = table.insertRow();

            row.insertCell().textContent = item.destination;

            row.insertCell().textContent =
                "₱ " + Number(item.price).toLocaleString("en-PH");

            row.insertCell().textContent = item.duration;

            var actions = row.insertCell();

            // EDIT TOUR BUTTON
            var editButton = document.createElement("button");

            editButton.textContent = "Edit Tour";
            editButton.className = "action-button edit-button";
            editButton.type = "button";

            editButton.onclick = function() {

                // SAVE THE SELECTED PACKAGE
                localStorage.setItem(
                    "selectedTourPackage",
                    JSON.stringify(item)
                );

                // SEND PACKAGE ID TO EDIT PAGE
                window.location.href =
                    "EditTour.html?id=" +
                    encodeURIComponent(item.id);

            };

            // DELETE BUTTON
            var deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className = "action-button delete-button";
            deleteButton.type = "button";

            deleteButton.onclick = function() {

                deletePackage(item.id);

            };

            actions.appendChild(editButton);
            actions.appendChild(deleteButton);

        });

        document.getElementById("emptyMessage").style.display =
            filteredPackages.length === 0 ? "block" : "none";

    }

    // DELETE TOUR PACKAGE
    function deletePackage(id) {

        var confirmDelete = confirm(
            "Are you sure you want to delete this tour package?"
        );

        if (confirmDelete) {

            packages = packages.filter(function(item) {

                return item.id !== id;

            });

            savePackages();
            displayPackages();

        }

    }

    // INITIAL DISPLAY
    displayPackages();

</script>

</body>
</html>
