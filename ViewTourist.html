
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourist Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background-color: #f7eeee;
            color: #111;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background-color: #14869a;
            color: white;
            padding: 25px 15px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.3;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: white;
            font-size: 21px;
            font-weight: bold;
            padding: 13px 15px;
            margin-bottom: 12px;
            border-radius: 12px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #40b7b4;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            min-width: 0;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #999;
            padding: 5px 10px 15px;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .topbar a {
            color: #111;
            text-decoration: none;
        }

        .admin {
            font-weight: bold;
        }

        h1 {
            background-color: #c2e9df;
            padding: 12px 18px;
            font-size: 27px;
            margin-bottom: 30px;
            max-width: 380px;
        }

        h2 {
            background-color: #c2e9df;
            padding: 10px 18px;
            font-size: 24px;
            margin-top: 25px;
            margin-bottom: 15px;
            max-width: 390px;
        }

        /* TOURIST DETAILS */
        .profile-cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            padding: 18px 14px;
            min-height: 85px;
            overflow-wrap: anywhere;
        }

        .card strong {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .card p {
            margin: 0;
            font-size: 15px;
        }

        /* BOOKING DETAILS */
        .booking-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 35px;
            max-width: 850px;
            padding: 0 15px;
        }

        .booking-item label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .booking-value {
            background-color: white;
            padding: 12px;
            border-radius: 7px;
            min-height: 42px;
            overflow-wrap: anywhere;
            font-size: 16px;
        }

        /* BACK BUTTON */
        .back-button {
            display: inline-block;
            margin: 80px 15px 10px;
            padding: 12px 25px;
            background-color: #36cdb2;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
            font-size: 16px;
        }

        .back-button:hover {
            background-color: #20ad98;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            background: #fff3cd;
            border-radius: 6px;
            display: none;
        }

        @media (max-width: 950px) {
            .sidebar {
                width: 210px;
            }

            .profile-cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .booking-grid {
                gap: 15px;
            }
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .logo {
                margin-bottom: 20px;
            }

            .main-content {
                padding: 12px;
            }

            .profile-cards,
            .booking-grid {
                grid-template-columns: 1fr;
            }

            .back-button {
                margin-top: 35px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            🌐 Travel&<br>
            &nbsp;&nbsp;&nbsp;&nbsp;Tours
        </div>

        <a href="Tourist_listhtml.html" class="active">
            ⌂ Tourist List
        </a>

        <a href="Tourpackage.html">
            🎟 Tour Package
        </a>

        <a href="Addtourist.html">
            ♙ Add Tourist
        </a>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="topbar">
            <a href="Login.html">⇦ Log out</a>
            <div class="admin">👤 Admin</div>
        </div>

        <h1>Tourist Profile</h1>

        <div id="message" class="message">
            No tourist selected. Please return to the Tourist List
            and click the profile button of a tourist.
        </div>

        <!-- TOURIST INFORMATION -->
        <div class="profile-cards">

            <div class="card">
                <strong id="touristName">Tourist Name</strong>
                <p>ID: <span id="touristID">---</span></p>
            </div>

            <div class="card">
                <strong>Contact:</strong>
                <p id="touristContact">---</p>
            </div>

            <div class="card">
                <strong>Email</strong>
                <p id="touristEmail">---</p>
            </div>

            <div class="card">
                <strong>Address:</strong>
                <p id="touristAddress">---</p>
            </div>

        </div>

        <!-- BOOKING INFORMATION -->
        <h2>Booking Info</h2>

        <div class="booking-grid">

            <div class="booking-item">
                <label>Tour package:</label>
                <div class="booking-value" id="tourPackage">
                    ---
                </div>
            </div>

            <div class="booking-item">
                <label>Travel date</label>
                <div class="booking-value" id="travelDate">
                    ---
                </div>
            </div>

            <div class="booking-item">
                <label>Number of traveller</label>
                <div class="booking-value" id="travellers">
                    ---
                </div>
            </div>

            <div class="booking-item">
                <label>Total Bill:</label>
                <div class="booking-value" id="totalBill">
                    ₱ 0
                </div>
            </div>

        </div>

        <a href="Tourist_listhtml.html" class="back-button">
            Back
        </a>

    </main>

</div>

<script>
    // Get the selected tourist from localStorage
    var tourist = JSON.parse(
        localStorage.getItem("selectedTourist")
    );

    // Show the tourist information
    if (tourist) {

        document.getElementById("touristName").textContent =
            tourist.fullname || tourist.name || "No name";

        document.getElementById("touristID").textContent =
            tourist.id || tourist.touristID || "---";

        document.getElementById("touristContact").textContent =
            tourist.contact || tourist.contactNumber || "---";

        document.getElementById("touristEmail").textContent =
            tourist.email || "---";

        document.getElementById("touristAddress").textContent =
            tourist.address || tourist.adress || "---";

        document.getElementById("tourPackage").textContent =
            tourist.tourPackage || tourist.packageName ||
            tourist.package || "---";

        document.getElementById("travelDate").textContent =
            tourist.bookingDate || tourist.travelDate || "---";

        document.getElementById("travellers").textContent =
            tourist.numberOfTravelers ||
            tourist.travelers ||
            tourist.passengers || "---";

        var bill = Number(
            tourist.totalCost || tourist.totalBill || 0
        );

        document.getElementById("totalBill").textContent =
            "₱ " + bill.toLocaleString("en-PH");

    } else {

        document.getElementById("message").style.display = "block";

    }
</script>

</body>
</html>
